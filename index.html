<!DOCTYPE html>
<html lang="pt-BR" class="theme-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Fio</title>

  <!-- PWA: manifest and theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fff0f5">

  <!-- Apple PWA: standalone mode, status bar and home screen title -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fio">

  <!-- Nunito: rounded, friendly typeface. Cached by sw.js after the first visit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">

  <!-- Bulma is the only styling framework, loaded from CDN and cached by sw.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">

  <!-- Pastel theme: overrides Bulma's own colour variables, no new classes -->
  <style>
    html.theme-light {
      --bulma-family-primary: "Nunito", "SF Pro Rounded", system-ui, sans-serif;
      --bulma-body-background-color: hsl(340, 100%, 98%);

      --bulma-scheme-h: 340;
      --bulma-scheme-s: 40%;
      --bulma-text-h: 340deg;
      --bulma-text-s: 18%;
      --bulma-text-l: 38%;
      --bulma-text-strong-l: 30%;

      --bulma-primary-h: 340deg;
      --bulma-primary-s: 80%;
      --bulma-primary-l: 80%;
      --bulma-link-h: 340deg;
      --bulma-link-s: 70%;
      --bulma-link-l: 75%;
      --bulma-success-h: 150deg;
      --bulma-success-s: 55%;
      --bulma-info-h: 265deg;
      --bulma-info-s: 70%;
    }

    .box {
      --bulma-box-radius: 1.5rem;
      --bulma-box-shadow: 0 0.5rem 1.25rem hsla(340, 60%, 70%, 0.18);
    }
  </style>
</head>

<body>
  <main class="section">
    <div class="container is-max-tablet">

      <header class="mb-5">
        <h1 class="title is-4">Fio 🧶</h1>
        <p class="subtitle is-6">Descubra quanto cobrar pela sua peça.</p>
      </header>

      <form id="pricing-form" novalidate autocomplete="off">
        <fieldset class="field">
          <legend class="label is-medium">Tempo trabalhado</legend>
          <div class="columns is-mobile">
            <div class="column">
              <label class="is-sr-only" for="input-hours">Horas</label>
              <div class="control">
                <input id="input-hours" class="input is-large is-rounded" type="number" inputmode="numeric" min="0" step="1" enterkeyhint="next" placeholder="0 h">
              </div>
            </div>
            <div class="column">
              <label class="is-sr-only" for="input-minutes">Minutos</label>
              <div class="control">
                <input id="input-minutes" class="input is-large is-rounded" type="number" inputmode="numeric" min="0" step="1" enterkeyhint="next" placeholder="0 min">
              </div>
            </div>
          </div>
        </fieldset>

        <div class="field">
          <label class="label is-medium" for="input-rate">Valor da hora (R$)</label>
          <div class="control">
            <input id="input-rate" class="input is-medium is-rounded" type="text" inputmode="decimal" enterkeyhint="next" placeholder="0,00">
          </div>
        </div>

        <fieldset class="field">
          <legend class="label is-medium">Custo dos materiais (R$)</legend>
          <div class="columns is-mobile is-variable is-2 mb-1" aria-hidden="true">
            <div class="column">
              <span class="is-size-7 has-text-weight-semibold">Nome</span>
            </div>
            <div class="column is-4">
              <span class="is-size-7 has-text-weight-semibold">Valor (R$)</span>
            </div>
            <div class="column is-narrow">
              <span class="button is-medium is-invisible py-0" style="height: 0; overflow: hidden;">
                <span class="icon"><svg width="18" height="18"></svg></span>
              </span>
            </div>
          </div>
          <div id="materials-list">
            <div class="columns is-mobile is-vcentered is-variable is-2 mb-2" data-material-row>
              <div class="column">
                <input class="input is-medium is-rounded" type="text" data-field="name" enterkeyhint="next" placeholder="Material" aria-label="Nome do material">
              </div>
              <div class="column is-4">
                <input class="input is-medium is-rounded" type="text" inputmode="decimal" data-field="cost" enterkeyhint="done" placeholder="0,00" aria-label="Valor do material (R$)">
              </div>
              <div class="column is-narrow">
                <button class="button is-medium is-rounded is-danger is-light" type="button" data-action="remove" aria-label="Remover item">
                  <span class="icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polyline points="3 6 5 6 21 6"></polyline>
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                  </span>
                </button>
              </div>
            </div>
          </div>
          <button id="add-material" class="button is-medium is-rounded is-primary is-light mt-1" type="button" aria-label="Adicionar item">
            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </span>
          </button>
        </fieldset>
      </form>

      <template id="material-row-template">
        <div class="columns is-mobile is-vcentered is-variable is-2 mb-2" data-material-row>
          <div class="column">
            <input class="input is-medium is-rounded" type="text" data-field="name" enterkeyhint="next" placeholder="Material" aria-label="Nome do material">
          </div>
          <div class="column is-4">
            <input class="input is-medium is-rounded" type="text" inputmode="decimal" data-field="cost" enterkeyhint="done" placeholder="0,00" aria-label="Valor do material (R$)">
          </div>
          <div class="column is-narrow">
            <button class="button is-medium is-rounded is-danger is-light" type="button" data-action="remove" aria-label="Remover item">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </template>

      <div class="box has-background-primary-light mt-5" aria-live="polite">
        <p class="is-size-7 has-text-weight-bold is-uppercase">Preço total a cobrar</p>
        <p id="output-total" class="title is-1 mb-0">R$ 0,00</p>
      </div>

      <div class="columns is-mobile">
        <div class="column">
          <div class="box has-background-success-light" aria-live="polite">
            <p class="is-size-7 has-text-weight-bold is-uppercase">Pagamento da artesã</p>
            <p id="output-pay" class="title is-4 mb-0">R$ 0,00</p>
          </div>
        </div>
        <div class="column">
          <div class="box has-background-info-light" aria-live="polite">
            <p class="is-size-7 has-text-weight-bold is-uppercase">Reserva do negócio</p>
            <p id="output-stash" class="title is-4 mb-0">R$ 0,00</p>
            <p class="is-size-7">margem de <span id="margin-percent"></span></p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
